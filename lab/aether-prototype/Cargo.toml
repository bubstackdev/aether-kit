[package]
name = "aether"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Local generative pipelines powered by Corsairs and Apple Core AI"
license = "Apache-2.0"

[dependencies]
# Published runtime; keep measurements tied to this exact release.
corsairs = "=0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
png = "0.18"

[dev-dependencies]
futures-executor = "0.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "render"

[[example]]
name = "parity"
