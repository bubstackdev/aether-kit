name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Replace stale PR builds, and stale main builds: a PR must be up to date to merge, so each main push is a tree its PR
# already passed (a documentation-only PR's tree gets its full run on main), and the newest main push supersedes the
# older ones. Merge-queue and manual runs are never cancelled by a newer run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the Swift jobs run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Only a pull request can skip the macOS jobs, and only when every file it changes is documentation, a spike
          # or Forge's Python, none of which the package builds or its weight-free tests read. Every other event builds.
          swift=true
          if [[ $EVENT == pull_request ]]; then
            # A pull_request checkout is the PR's merge commit, whose first parent is the base branch.
            # --no-renames lists a moved file's old path too, so moving a file out of the package can't look like a docs change.
            changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
            echo "$changed"
            if [[ -n $changed ]] && ! grep -qvE '^(docs/|Spikes/|Forge/|[^/]+\.md$|LICENSE$|NOTICE$)' <<<"$changed"; then
              swift=false
            fi
          fi
          echo "swift=$swift" | tee -a "$GITHUB_OUTPUT"

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck Scripts/check.sh Scripts/check-cpu.sh Scripts/check-ci-host.sh Scripts/check-floor.sh \
            Scripts/launch-floor-consumer.sh Scripts/check-api.sh Examples/SampleApp/make-catalog.sh

  # The four Swift jobs run in parallel on separate xcode-27 runners; each builds what it needs from a clean checkout.
  floor-macos:
    name: Package floor (macOS 14)
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple silicon and the supported toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/aether-ci"
          sh Scripts/check-ci-host.sh | tee "$RUNNER_TEMP/aether-ci/toolchain.log"
      - name: Cache dependency repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cache/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Every product and the floor consumer at macOS 14
        run: |
          sh Scripts/check-floor.sh --macos "$RUNNER_TEMP/floor-stage" 2>&1 | tee "$RUNNER_TEMP/aether-ci/floor-macos.log"
          # A tarball keeps the executable bits that artifact upload would drop.
          tar -C "$RUNNER_TEMP/floor-stage" -cf "$RUNNER_TEMP/floor-consumer.tar" .
      - name: Upload the floor consumer for the macOS 14 launch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floor-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/floor-consumer.tar
          if-no-files-found: error
          retention-days: 3
      - name: Preserve diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-floor-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aether-ci/
          if-no-files-found: warn
          retention-days: 14

  floor-ios:
    name: Package floor (iOS 17)
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple silicon and the supported toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/aether-ci"
          sh Scripts/check-ci-host.sh | tee "$RUNNER_TEMP/aether-ci/toolchain.log"
      - name: Cache dependency repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cache/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Every library and the floor consumer at iOS 17
        run: sh Scripts/check-floor.sh --ios 2>&1 | tee "$RUNNER_TEMP/aether-ci/floor-ios.log"
      - name: Preserve diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-floor-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aether-ci/
          if-no-files-found: warn
          retention-days: 14

  contracts:
    name: Release contracts and consumers
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple silicon and the supported toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/aether-ci"
          sh Scripts/check-ci-host.sh | tee "$RUNNER_TEMP/aether-ci/toolchain.log"
      - name: Cache dependency repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cache/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Weight-free Release contracts
        run: |
          sh Scripts/check-cpu.sh --force-resolved-versions \
            --xunit-output "$RUNNER_TEMP/aether-ci/tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/aether-ci/contracts.log"
          # Swift Testing adds this suffix to the requested xUnit filename.
          test -s "$RUNNER_TEMP/aether-ci/tests-swift-testing.xml"
      - name: Independent foundation consumer
        run: |
          swift run --package-path Examples/Foundations --force-resolved-versions -c release \
            2>&1 | tee "$RUNNER_TEMP/aether-ci/foundations.log"
      - name: Independent SDK consumer
        run: |
          swift run --package-path Examples/LocalPackage --force-resolved-versions -c release \
            2>&1 | tee "$RUNNER_TEMP/aether-ci/sdk-consumer.log"
      - name: Sample app logic
        run: |
          swift test --package-path Examples/SampleApp/SampleAppCore --force-resolved-versions \
            2>&1 | tee "$RUNNER_TEMP/aether-ci/sample-app-core.log"
      - name: Preserve diagnostics and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aether-ci/
          if-no-files-found: warn
          retention-days: 14

  api:
    name: Public API (frozen)
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple silicon and the supported toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/aether-ci"
          sh Scripts/check-ci-host.sh | tee "$RUNNER_TEMP/aether-ci/toolchain.log"
          xcrun --find swift-api-digester | tee -a "$RUNNER_TEMP/aether-ci/toolchain.log"
      - name: Cache dependency repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cache/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swift-repositories-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compare the frozen API with the committed baseline
        run: |
          sh Scripts/check-api.sh 2>&1 | tee "$RUNNER_TEMP/aether-ci/api.log"
      - name: Preserve diagnostics
        if: ${{ !cancelled() }}
        run: |
          # The pruned dumps and the digester's reports, so a failure shows exactly what changed.
          if [[ -d .build/api-check ]]; then cp -R .build/api-check "$RUNNER_TEMP/aether-ci/api-check"; fi
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aether-ci/
          if-no-files-found: warn
          retention-days: 14

  floor-launch:
    name: Launch without CoreAI (macOS 15)
    needs: floor-macos
    # GitHub-hosted macOS 15 (Apple silicon) has no CoreAI framework, so the floor consumer built by floor-macos only
    # launches if CoreAI is weak-linked. GitHub retires its macos-14 image on 2026-11-02, so macOS 15 is the oldest hosted
    # OS left. (There is no iOS 17 simulator launch: CoreAI isn't in the iOS Simulator SDK, so nothing that links the
    # facade builds for the simulator; docs/deployment-floor.md.)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the floor consumer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: floor-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Launch it and require unsupportedOS
        run: |
          mkdir -p "$RUNNER_TEMP/floor-stage"
          tar -C "$RUNNER_TEMP/floor-stage" -xf "$RUNNER_TEMP/floor-consumer.tar"
          sh Scripts/launch-floor-consumer.sh "$RUNNER_TEMP/floor-stage"

  required:
    name: CI passed
    # A cancelled main run (superseded or manual) skips the gate instead of failing it; a cancelled PR run still fails.
    if: ${{ always() && !(github.event_name == 'push' && cancelled()) }}
    needs: [changes, workflows, floor-macos, floor-ios, contracts, api, floor-launch]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          SWIFT: ${{ needs.changes.outputs.swift }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_RESULT: ${{ needs.workflows.result }}
          FLOOR_MACOS_RESULT: ${{ needs.floor-macos.result }}
          FLOOR_IOS_RESULT: ${{ needs.floor-ios.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          API_RESULT: ${{ needs.api.result }}
          FLOOR_RESULT: ${{ needs.floor-launch.result }}
        run: |
          echo "Change scope: $CHANGES_RESULT (Swift jobs: $SWIFT)"
          echo "Workflow validation: $WORKFLOW_RESULT"
          echo "Package floor (macOS 14): $FLOOR_MACOS_RESULT"
          echo "Package floor (iOS 17): $FLOOR_IOS_RESULT"
          echo "Release contracts and consumers: $CONTRACTS_RESULT"
          echo "Public API (frozen): $API_RESULT"
          echo "Launch without CoreAI: $FLOOR_RESULT"
          [[ "$CHANGES_RESULT" == success && "$WORKFLOW_RESULT" == success ]]
          # The Swift jobs must all succeed, or, only for a documentation-only pull request, all be skipped.
          if [[ "$SWIFT" == false ]]; then expected=skipped; else expected=success; fi
          for result in "$FLOOR_MACOS_RESULT" "$FLOOR_IOS_RESULT" "$CONTRACTS_RESULT" "$API_RESULT" "$FLOOR_RESULT"; do
            [[ "$result" == "$expected" ]]
          done
