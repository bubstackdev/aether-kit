# On-device language and Qwen3-VL qualification host (XcodeGen spec). Generate with `xcodegen generate` here; the
# generated LanguageDeviceProbe.xcodeproj is git-ignored. `Forge/language/stage_device_assets.py` copies a bundle
# (re-registered for iOS) and its reference into Assets/ (git-ignored except .gitkeep) before a device run.
# LanguageDeviceProbe.entitlements requests the increased memory limit, for the Qwen3-VL-2B. That capability needs an
# explicit App ID with it enabled (a wildcard App ID can't carry it); signing stays automatic. Explicit App IDs are unique
# across teams: outside the owner's team, first change PRODUCT_BUNDLE_IDENTIFIER below to an ID in your own team. To let
# Xcode register it, select your team for the target in the generated project and build once; that setting lives in the
# git-ignored .xcodeproj, so the next `xcodegen generate` resets it.
name: LanguageDeviceProbe
options:
  deploymentTarget:
    iOS: "27.0"
packages:
  AetherKit:
    path: ../..
targets:
  LanguageDeviceProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: AetherKit
        product: AetherKit
      - package: AetherKit
        product: AetherLanguageCoreAI
      - package: AetherKit
        product: AetherVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zakkeown.aether.language-device-probe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: LanguageDeviceProbe.entitlements
        TARGETED_DEVICE_FAMILY: "1"
