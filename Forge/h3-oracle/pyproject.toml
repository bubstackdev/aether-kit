# Development tooling only: the H3 (MiniMax H3) CPU oracle and profile export, never required by SDK consumers.
# Pinned to exactly the environment that produced the 2026-10-26 H3 evidence (every installed package at its version;
# diffusers at the public huggingface/diffusers commit carrying the MiniMax H3 modules):
#
#     uv sync --frozen --project Forge/h3-oracle
#     Forge/h3-oracle/.venv/bin/python -I -B Scripts/prepare-h3-profile-oracle.py ...
#
# Separate from Forge/pyproject.toml: H3 needs torch 2.13 and transformers 5, the language and Kokoro tooling torch
# 2.11 and transformers 4.57.
[project]
name = "aether-kit-forge-h3-oracle"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.15.0",
    "annotated-doc==0.0.5",
    "anyio==4.15.1",
    "certifi==2026.10.18",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "coreai-core==1.0.0b2",
    "coreai-torch==0.4.2",
